# Local Postgres only. Do not point this at production.
services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_DB: pesamatters
      POSTGRES_USER: pesamatters
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesamatters -d pesamatters"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pesamatters-pg:/var/lib/postgresql/data

volumes:
  pesamatters-pg:
